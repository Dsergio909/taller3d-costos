# n8n + Postgres para el flujo de cotización del taller.
#
# Uso:
#   1. Copia .env.example a .env y pon una contraseña en POSTGRES_PASSWORD.
#   2. docker compose up -d
#   3. Abre http://localhost:5679 e importa flujos/aviso_errores.json y flujos/cotizacion.json.
#
# El flujo lee datos/ (los mismos CSV del tablero) y escribe en registro/.
# Ollama corre fuera de Docker: dentro del contenedor se llega con host.docker.internal
# (cambia «ollama_url» en el nodo Configuración del flujo).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5679:5678"   # 5679 en el PC, para no chocar con otro n8n en 5678
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_RESTRICT_FILE_ACCESS_TO: /taller/datos;/taller/registro
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    working_dir: /taller
    volumes:
      - ./datos:/taller/datos:ro
      - ./registro:/taller/registro
      - ./flujos:/taller/flujos:ro
      - n8n_datos:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_datos:
  n8n_datos:
